[project]
name = "lexguard-backend"
version = "0.2.0"
description = "LEXGUARD adversarial multi-agent contract analysis API"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]
# FastAPI's dependency-injection idiom uses calls in argument defaults.
ignore = ["B008", "E501"]  # long prompt strings are left to the formatter

[tool.ruff.lint.isort]
known-first-party = ["agents", "config", "models", "security", "services"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
